name: Rebuild photo contact sheet

on:
  workflow_dispatch:
  push:
    paths:
      - "documentation/product-images/**"
      - "scripts/make_contact_sheet.py"
      - ".github/workflows/contact-sheet.yml"

permissions:
  contents: write

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Pillow
        run: python -m pip install --user Pillow
      - name: Generate contact sheet from repository photos
        run: python scripts/make_contact_sheet.py
      - name: Commit generated contact sheet if changed
        run: |
          git add documentation/images/00-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: regenerate photo contact sheet"
            git push
          fi
