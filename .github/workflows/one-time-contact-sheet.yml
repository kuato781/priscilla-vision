name: One-time corrected adapter contact sheet

on:
  push:
    paths:
      - ".github/workflows/one-time-contact-sheet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate contact sheet with rotated uncropped adapter
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          base=Path('documentation/product-images')
          out=Path('documentation/images/00-contact-sheet.jpg')
          items=[('BEFORE  |  RUBBER BANDS','ghetto_mount.jpg'),('THE CUSTOM V2 ADAPTER','adaptor.jpg'),('AFTER  |  INSTALLED','priscilla_vision_1.jpg'),('AFTER  |  SIDE VIEW','priscilla_vision_2.jpg')]
          fontpath='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font=lambda n: ImageFont.truetype(fontpath,n)
          W,H=1600,1090
          im=Image.new('RGB',(W,H),'#0c1420')
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((16,16,W-16,H-16),radius=28,outline='#ff851c',width=5)
          d.text((52,37),'PRISCILLA VISION',font=font(55),fill='white')
          d.text((54,110),'#FPD  /  FULLY PROTOTYPED DUMBASSERY',font=font(24),fill='#ff851c')
          for i,(label,name) in enumerate(items):
              x=55+(i%2)*755
              y=165+(i//2)*383
              d.rounded_rectangle((x,y,x+732,y+360),radius=18,fill='#182337')
              with Image.open(base/name) as src:
                  src=ImageOps.exif_transpose(src).convert('RGB')
                  if name=='adaptor.jpg':
                      # Crop to actual grey printed part; rotate to horizontal then CONTAIN entire object.
                      # Never use ImageOps.fit on this photo: it crops off both ball ends.
                      mask=src.convert('L').point(lambda p: 255 if p<210 else 0)
                      bbox=mask.getbbox()
                      if bbox:
                          margin=25
                          bbox=(max(0,bbox[0]-margin),max(0,bbox[1]-margin),min(src.width,bbox[2]+margin),min(src.height,bbox[3]+margin))
                          src=src.crop(bbox)
                          mask=mask.crop(bbox)
                      paper=src.getpixel((0,0))
                      src=src.rotate(-69,resample=Image.Resampling.BICUBIC,expand=True,fillcolor=paper)
                      mask=mask.rotate(-69,resample=Image.Resampling.NEAREST,expand=True,fillcolor=0)
                      bbox=mask.getbbox()
                      if bbox:
                          margin=20
                          bbox=(max(0,bbox[0]-margin),max(0,bbox[1]-margin),min(src.width,bbox[2]+margin),min(src.height,bbox[3]+margin))
                          src=src.crop(bbox)
                      photo=ImageOps.contain(src,(700,294),method=Image.Resampling.LANCZOS)
                      px=x+(732-photo.width)//2
                      py=y+9+(300-photo.height)//2
                      im.paste(photo,(px,py))
                  else:
                      photo=ImageOps.fit(src,(716,305),method=Image.Resampling.LANCZOS,centering=(.5,.5))
                      im.paste(photo,(x+8,y+8))
              d.text((x+14,y+324),label,font=font(24),fill='white')
          d.text((56,947),'We designed, prototyped, documented, and published an entire',font=font(25),fill='white')
          d.text((56,991),'engineering project to replace two rubber bands.',font=font(28),fill='#ff851c')
          out.parent.mkdir(parents=True,exist_ok=True)
          im.save(out,quality=88,optimize=True,subsampling=0)
          print(out,out.stat().st_size)
          PY
      - name: Publish contact sheet
        run: |
          git add documentation/images/00-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: rotate and fit adapter fully in contact sheet"
            git push
          fi
