name: One-time Priscilla Vision contact sheet

on:
  push:
    paths:
      - ".github/workflows/one-time-contact-sheet.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate four-photo sheet from original photos
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          base=Path('documentation/product-images')
          out=Path('documentation/images/00-contact-sheet.jpg')
          items=[('BEFORE  |  RUBBER BANDS','ghetto_mount.jpg'),('THE CUSTOM V2 ADAPTER','adaptor.jpg'),('AFTER  |  INSTALLED','priscilla_vision_1.jpg'),('AFTER  |  SIDE VIEW','priscilla_vision_2.jpg')]
          fontpath='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font=lambda n: ImageFont.truetype(fontpath,n)
          W,H=1600,1090
          im=Image.new('RGB',(W,H),'#0c1420')
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((16,16,W-16,H-16),radius=28,outline='#ff851c',width=5)
          d.text((52,37),'PRISCILLA VISION',font=font(55),fill='white')
          d.text((54,110),'#FPD  /  FULLY PROTOTYPED DUMBASSERY',font=font(24),fill='#ff851c')
          for i,(label,name) in enumerate(items):
              col=i%2
              row=i//2
              x=55+col*755
              y=165+row*383
              d.rounded_rectangle((x,y,x+732,y+360),radius=18,fill='#182337')
              with Image.open(base/name) as src:
                  photo=ImageOps.fit(ImageOps.exif_transpose(src).convert('RGB'),(716,305),method=Image.Resampling.LANCZOS,centering=(.5,.5))
                  im.paste(photo,(x+8,y+8))
              d.text((x+14,y+324),label,font=font(24),fill='white')
          d.text((56,947),'We designed, prototyped, documented, and published an entire',font=font(25),fill='white')
          d.text((56,991),'engineering project to replace two rubber bands.',font=font(28),fill='#ff851c')
          out.parent.mkdir(parents=True,exist_ok=True)
          im.save(out,quality=88,optimize=True,subsampling=0)
          print(out, out.stat().st_size)
          PY
      - name: Publish contact sheet
        run: |
          git add documentation/images/00-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: publish four-photo contact sheet"
            git push
          fi
